   #   issueValidate=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=feat-labdevsecops&componentsKeys=${{ github.event.repository.name }}-cursoseg'&facets=severities)
